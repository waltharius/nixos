# ansible/ansible.cfg - settings for Ansible as run by `nix run .#fleet`
# (it sets ANSIBLE_CONFIG to this file). Ansible is not run by hand: the
# inventory is generated from the Nix inventory (hosts/devices/) at run
# time, the collections are installed into ansible/.collections from
# requirements.yml, and SSH logs in through the aliases of the generated
# ~/.ssh/config.d/devices.
[defaults]
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
nocows = True

[ssh_connection]
pipelining = True
